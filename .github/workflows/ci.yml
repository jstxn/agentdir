name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The store resolves paths and installs hook shims per platform, so
          # cover macOS on one version rather than trusting Linux alone.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git identity
        # The suite creates repositories and commits into them.
        run: |
          git config --global user.email "ci@agentdir.test"
          git config --global user.name "AgentDir CI"
          git config --global init.defaultBranch main
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src tests
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check every shipped version string agrees with pyproject
        run: |
          python - <<'PY'
          import json, pathlib, re

          version = re.search(
              r'^version = "([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          ).group(1)

          problems = []

          package = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          if package["version"] != version:
              problems.append(f"package.json version is {package['version']}")

          init = pathlib.Path("src/agentdir/__init__.py").read_text(encoding="utf-8")
          declared = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if declared != version:
              problems.append(f"__init__.py __version__ is {declared}")

          # The installer pins the release it downloads, so a stale default
          # keeps shipping the previous version from the public curl | bash.
          install = pathlib.Path("scripts/install.sh").read_text(encoding="utf-8")
          pinned = re.search(r'AGENTDIR_VERSION="\$\{AGENTDIR_VERSION:-v([^"}]+)\}"', install).group(1)
          if pinned != version:
              problems.append(f"scripts/install.sh pins v{pinned}")

          if problems:
              raise SystemExit(
                  f"pyproject declares {version} but: " + "; ".join(problems)
              )
          print(f"versions match: {version}")
          PY
      - name: Check the install scripts parse
        run: |
          bash -n scripts/install.sh
          bash -n scripts/rollback.sh
