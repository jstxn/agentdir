name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re

          tag = os.environ["RELEASE_TAG"]
          version = re.search(
              r'^version = "([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(
                  f"release tag {tag!r} does not match pyproject.toml version {expected!r}"
              )
          print(f"release tag matches pyproject.toml: {tag}")
          PY
      - name: Configure git identity
        run: |
          git config --global user.email "ci@agentdir.test"
          git config --global user.name "AgentDir CI"
          git config --global init.defaultBranch main
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest build twine
      - run: python -m pytest -q
      - run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Generate SHA256SUMS
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Remove non-distribution checksum manifest before PyPI upload
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
