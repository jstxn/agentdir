[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdir"
version = "0.1.1"
description = "Local-first Maildir-inspired work mailstore for software agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "AgentDir Contributors" }
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: System :: Archiving",
]

[project.urls]
Homepage = "https://github.com/jstxn/agentdir"
Repository = "https://github.com/jstxn/agentdir"
Issues = "https://github.com/jstxn/agentdir/issues"

[project.scripts]
agentdir = "agentdir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
