[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdir-cli"
version = "0.7.8"
description = "Local-first Maildir-inspired work mailstore for software agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "AgentDir Contributors" }
]
dependencies = [
  "platformdirs>=4.2",
  "rich>=13.7",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: System :: Archiving",
]

[project.urls]
Homepage = "https://github.com/jstxn/agentdir"
Repository = "https://github.com/jstxn/agentdir"
Issues = "https://github.com/jstxn/agentdir/issues"

[project.scripts]
agentdir = "agentdir.cli:main"

[project.optional-dependencies]
watch = [
  "watchfiles>=0.21",
]
semantic = [
  "fastembed>=0.4",
  "sqlite-vec>=0.1",
]
team = [
  "qdrant-client>=1.9",
  "lancedb>=0.9",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
